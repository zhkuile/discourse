# 云顶论坛改造执行计划（结合项目实际）

本文档基于当前 Discourse 项目的实际代码结构，提供可直接执行的改造方案。

---

## 前置条件：启动开发环境

在开始改造前，请先按照 [Windows 11 开发环境设置指南](./WINDOWS-SETUP.md) 启动项目。

**推荐方式**：使用 Dev Container

```bash
# 1. 确保 Docker Desktop 已启动
# 2. 在 VS Code 中打开项目
# 3. 点击 "Reopen in Container"
# 4. 等待容器启动完成
# 5. 访问 http://localhost:4200
```

---

## 阶段一：基础品牌替换（1-2天）

### 1.1 准备品牌资产

创建品牌资产目录并准备文件：

```bash
# 在项目根目录创建品牌资产文件夹
mkdir -p public/images/yunding-branding
```

**需要准备的文件**：

| 文件名 | 尺寸 | 用途 |
|--------|------|------|
| `logo.png` | 建议 200x50px | 主 Logo |
| `logo-small.png` | 建议 36x36px | 小 Logo（导航栏） |
| `logo-dark.png` | 建议 200x50px | 暗色模式主 Logo |
| `logo-small-dark.png` | 建议 36x36px | 暗色模式小 Logo |
| `favicon.ico` | 32x32px | 浏览器图标 |
| `apple-touch-icon.png` | 180x180px | iOS 图标 |
| `og-image.png` | 1200x630px | 社交分享图 |
| `email-logo.png` | 建议 400x100px | 邮件 Logo |

**临时方案**：如果暂时没有设计资源，可以先使用文字 Logo：

```bash
# 创建临时文字 Logo（需要 ImageMagick）
convert -size 200x50 xc:white -font Arial -pointsize 24 \
  -fill "#2c3e50" -gravity center -annotate +0+0 "云顶论坛" \
  public/images/yunding-branding/logo.png
```

